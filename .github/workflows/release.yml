name: Release DomacDesk

# Gera Windows (x64 e ARM64), Android (APKs por arquitetura + universal) e Linux
# (.deb e AppImage) e publica tudo em Releases.
#
# Como usar:
#   - Crie uma tag nova; não reutilize uma versão já distribuída.
#   - Ou rode manualmente em Actions > Release DomacDesk > Run workflow

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag NOVA da release (ex.: v1.5.3-1; nunca reutilize uma tag existente)"
        required: true
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.tag || github.ref_name }}
      publish-update-metadata: false
