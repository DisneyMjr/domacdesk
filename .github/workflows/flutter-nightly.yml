name: Flutter Nightly Build

on:
  # Build noturno automatico desativado; rode manualmente se quiser.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      publish-update-metadata: false
